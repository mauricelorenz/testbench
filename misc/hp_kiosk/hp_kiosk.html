<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Happy Pottery Kiosk</title>
<style>
  body { margin: 0; overflow: hidden; }
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: #333;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 10px;
    z-index: 1000;
  }
  #toolbar button {
    font-size: 18px;
    padding: 5px 15px;
    margin-right: 10px;
    cursor: pointer;
  }
  #frame {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: calc(100% - 50px);
    border: none;
  }
  #motd {
    font-family: Arial, Helvetica, sans-serif;
    margin: auto;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="history.back()">⬅ Zurück</button>
  <div id="motd">Unter MEINE KURSE finden Sie eine Auswahl an kostenlosen Videos. Sie möchten Zugriff auf die kostenpflichtigen Kurse? Sprechen Sie uns gerne an.</div>
</div>

<iframe id="frame" src="https://akademie.tonhaus-keramik.de/app/customer/dashboard/" sandbox="allow-forms allow-modals allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" allow="fullscreen"></iframe>

</body>
</html>
